name: Test and Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, production]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: crypto_news
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crypto_news
          DB_NAME: crypto_news
          DB_USER: postgres
          DB_PASS: postgres
          AWS_ACCESS_KEY_ID: test_key
          AWS_SECRET_ACCESS_KEY: test_secret
          COINGECKO_API_KEY: test_api_key
          S3_BUCKET_NAME: test_bucket
        run: PYTHONPATH=src pytest tests/ -v

      - name: Run linting
        run: |
          flake8 src/ tests/
          black --check src/ tests/
